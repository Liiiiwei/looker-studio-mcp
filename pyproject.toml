[project]
name = "looker-studio-mcp"
version = "0.1.0"
description = "依客戶與範本組出 Looker Studio Linking API 網址的 MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
